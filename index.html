<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор себестоимости | Виктория</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky: #e8f5f8;
            --white: #fff;
            --ink: #26363b;
            --muted: #718188;
            --blue-dark: #3e7f91;
            --line: #9ac2d1;
            --accent: #38bdf8;
            --shadow: 0 12px 35px rgba(70, 116, 128, .12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--sky);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .calc-container {
            background: var(--white);
            max-width: 800px;
            width: 100%;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--line);
            overflow: hidden;
        }

        .calc-header {
            background-image: linear-gradient(rgba(232, 245, 248, 0.8), rgba(232, 245, 248, 0.8)), url('https://www.transparenttextures.com/patterns/cubes.png');
            padding: 30px 40px;
            border-bottom: 1px solid var(--line);
            text-align: center;
        }

        .calc-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            color: #264a52;
            margin-bottom: 10px;
        }

        .calc-header p {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--blue-dark);
            font-weight: 600;
        }

        .calc-body { padding: 40px; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--blue-dark);
            text-transform: uppercase;
        }

        select, input[type="text"] {
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--ink);
            background: #f8fcFD;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        select:focus, input[type="text"]:focus { border-color: var(--blue-dark); }

        .quick-weights {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .qw-btn {
            background: var(--sky);
            border: 1px solid var(--line);
            color: var(--blue-dark);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .qw-btn:hover, .qw-btn.active {
            background: var(--blue-dark);
            color: var(--white);
            border-color: var(--blue-dark);
        }

        .results-panel {
            background: #f0f9ff;
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            position: relative;
        }

        .results-panel::before {
            content: "ИТОГО";
            position: absolute;
            top: -11px;
            left: 20px;
            background: #bae6fd;
            color: #0369a1;
            padding: 4px 11px;
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border: 1px solid #7dd3fc;
            border-radius: 3px;
        }

        .total-price {
            font-size: 38px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            color: #0369a1;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 13px;
            color: #315963;
        }

        .stats-grid div {
            background: var(--white);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #bae6fd;
        }

        .stats-grid b { font-weight: 600; color: #0284c7; }

        .recipe-breakdown h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            color: #264a52;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 10px;
        }

        .ingredient-list { list-style: none; }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #d1e3e8;
            font-size: 14px;
        }

        .ingredient-name { font-weight: 500; }
        .ingredient-calc { color: var(--muted); font-size: 13px; }
        .ingredient-cost { font-weight: 600; color: var(--blue-dark); }

        @media (max-width: 600px) {
            .controls { grid-template-columns: 1fr; }
            .calc-body { padding: 25px; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="calc-container">
        <div class="calc-header">
            <h1>Калькулятор себестоимости</h1>
            <p>Внутренняя панель мастера</p>
        </div>
        
        <div class="calc-body">
            <div class="controls">
                <div class="input-group">
                    <label for="cakeSelect">Выберите начинку</label>
                    <select id="cakeSelect">
                        <option value="milky_girl">Молочная девочка</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="weightInput">Вес торта (кг)</label>
                    <div>
                        <input type="text" inputmode="decimal" id="weightInput" value="1.5" placeholder="Например: 1.2 или 2,5">
                        <div class="quick-weights" id="quickWeights">
                            <button type="button" class="qw-btn" data-weight="1">1 кг</button>
                            <button type="button" class="qw-btn active" data-weight="1.5">1.5 кг</button>
                            <button type="button" class="qw-btn" data-weight="2">2 кг</button>
                            <button type="button" class="qw-btn" data-weight="2.5">2.5 кг</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="results-panel">
                <div class="total-price" id="finalCost">0 ₽</div>
                <div class="stats-grid">
                    <div>Себестоимость 1 кг: <b id="costPerKg">0 ₽</b></div>
                    <div>Вес по рецепту (до выпекания): <b id="rawWeight">0 кг</b></div>
                </div>
            </div>

            <div class="recipe-breakdown">
                <h3>Расход продуктов на вашу граммовку</h3>
                <ul class="ingredient-list" id="breakdownList"></ul>
            </div>
        </div>
    </div>

    <script>
        const db = {
            flour: { name: "Мука", price: 62, unit: 1000, measure: "г" },
            sugar: { name: "Сахар", price: 89, unit: 1000, measure: "г" },
            butter: { name: "Масло сливочное", price: 160, unit: 180, measure: "г" },
            condensed: { name: "Сгущенное молоко", price: 139, unit: 380, measure: "г" },
            baking_powder: { name: "Разрыхлитель", price: 14, unit: 10, measure: "г" },
            eggs: { name: "Яйца С0", price: 85, unit: 10, measure: "шт" },
            cream_cheese: { name: "Творожный сыр", price: 230, unit: 350, measure: "г" },
            mascarpone: { name: "Маскарпоне", price: 259, unit: 250, measure: "г" },
            raspberry: { name: "Малина", price: 650, unit: 1000, measure: "г" },
            cream: { name: "Сливки", price: 169, unit: 250, measure: "г" },
            vanillin: { name: "Ванилин", price: 15, unit: 1, measure: "уп" }
        };

        const recipes = {
            milky_girl: {
                name: "Молочная девочка",
                expected_yield_kg: 3.5, 
                items: [
                    { id: "flour", qty: 400 },
                    { id: "butter", qty: 400 },
                    { id: "condensed", qty: 800 },
                    { id: "baking_powder", qty: 20 },
                    { id: "eggs", qty: 5 },
                    { id: "cream_cheese", qty: 1000 },
                    { id: "mascarpone", qty: 250 },
                    { id: "cream", qty: 250 },
                    { id: "sugar", qty: 100 },
                    { id: "vanillin", qty: 1 },
                    { id: "raspberry", qty: 300 }
                ]
            }
        };

        const select = document.getElementById('cakeSelect');
        const input = document.getElementById('weightInput');
        const list = document.getElementById('breakdownList');
        const qwButtons = document.querySelectorAll('.qw-btn');
        
        function calculate() {
            const recipeKey = select.value;
            const rawInputValue = input.value.replace(',', '.');
            const targetWeight = parseFloat(rawInputValue) || 0;
            const recipe = recipes[recipeKey];
            
            let batchCost = 0;
            let rawWeightGrams = 0;
            let breakdownHTML = '';

            recipe.items.forEach(item => {
                const ingredient = db[item.id];
                const costForRecipe = (ingredient.price / ingredient.unit) * item.qty;
                batchCost += costForRecipe;

                if (ingredient.measure === 'г') {
                    rawWeightGrams += item.qty;
                } else if (item.id === 'eggs') {
                    rawWeightGrams += item.qty * 50;
                }
            });

            const costPerKg = batchCost / recipe.expected_yield_kg;
            const finalCost = costPerKg * targetWeight;
            const multiplier = targetWeight / recipe.expected_yield_kg;

            recipe.items.forEach(item => {
                const ingredient = db[item.id];
                const targetQty = item.qty * multiplier;
                const targetCost = (ingredient.price / ingredient.unit) * targetQty;
                
                breakdownHTML += `
                    <li class="ingredient-item">
                        <div>
                            <span class="ingredient-name">${ingredient.name}</span>
                            <div class="ingredient-calc">${targetQty.toFixed(0)} ${ingredient.measure} × ${(ingredient.price / ingredient.unit).toFixed(2)} ₽/${ingredient.measure}</div>
                        </div>
                        <span class="ingredient-cost">${targetCost.toFixed(1)} ₽</span>
                    </li>
                `;
            });

            document.getElementById('finalCost').textContent = finalCost.toFixed(0) + ' ₽';
            document.getElementById('costPerKg').textContent = costPerKg.toFixed(0) + ' ₽';
            document.getElementById('rawWeight').textContent = (rawWeightGrams / 1000).toFixed(2) + ' кг';
            list.innerHTML = breakdownHTML;

            qwButtons.forEach(btn => {
                if (btn.dataset.weight === rawInputValue) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        select.addEventListener('change', calculate);
        input.addEventListener('input', calculate);

        qwButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                input.value = e.target.dataset.weight;
                calculate();
            });
        });

        calculate();
    </script>
</body>
</html>
